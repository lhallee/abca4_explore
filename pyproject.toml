[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abca4-avi"
version = "0.1.0"
description = "Reproducible ClinVar and AlphaGenome AVI analysis for ABCA4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alphagenome>=0.9.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18",
    "python-dotenv>=1.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[project.scripts]
abca4-avi = "abca4_avi.cli:main"

[dependency-groups]
dev = [
    "pillow>=11",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abca4_avi"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["live: tests that call external APIs"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-cache-plan", ".venv", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
